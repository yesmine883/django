{% extends 'magasin/base.html' %}

{% block body %}
<div class="container mt-4">
    <div class="col-md-12 text-center">
        <h2>Manipulation Produit</h2>
    </div> 
    
    <form method="POST" enctype="multipart/form-data" class="post-form mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>

    <!-- Débogage simple -->
    <hr>
    <p>Formulaire brut (debug) : {{ form }}</p>
</div>
{% endblock %}
